<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PP Basemap Comparison</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css">
<style>
  :root {
    --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --card: #fff;
    --accent: #38A800; --warn: #b54708; --ok: #027a48;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --fg: #ececea; --muted: #a3a39e; --line: #33332f; --card: #1f1f1d;
      --warn: #f79009; --ok: #32d583;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  button, select, input { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  label { display: inline-flex; gap: 6px; align-items: center; }
  .spacer { flex: 1; }
  section[hidden] { display: none !important; }
  #tab-basemaps { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 8px 16px 16px; height: calc(100vh - 56px); }
  .viewbar { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 4px; min-width: 92px; text-align: center; }
  .viewbar .zoom { font: 600 18px/1.1 ui-monospace, Consolas, monospace; }
  .viewbar .coords { font: 11px/1.3 ui-monospace, Consolas, monospace; color: var(--muted); }
  .viewbar button { font-size: 11px; padding: 2px 6px; margin-top: 4px; }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .pane select { flex: 1; min-width: 0; }
  .note { font-size: 12px; color: var(--muted); min-height: 36px; margin-bottom: 6px; }
  .note b.ok { color: var(--ok); } .note b.warn { color: var(--warn); }
  .mapwrap { position: relative; flex: 1; min-height: 260px; }
  .map { position: absolute; inset: 0; border: 1px solid var(--line); border-radius: 6px; }
  .legend { position: absolute; top: 8px; left: 8px; z-index: 2; max-width: 260px; max-height: calc(100% - 16px); overflow: auto;
    background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .legend summary { cursor: pointer; padding: 6px 8px; font-weight: 600; user-select: none; }
  .legend .rows { padding: 0 8px 8px; display: grid; gap: 4px; }
  .legend .row { display: grid; grid-template-columns: 1fr 70px; gap: 6px; align-items: center; }
  .legend .row label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend input[type=range] { width: 70px; padding: 0; }
  .legend .head { font-weight: 600; color: var(--muted); margin-top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  #tab-thumbs { padding: 12px 16px; }
  #thumbs { display: grid; gap: 16px; margin-top: 12px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .row h3 { margin: 0 0 8px; font-size: 14px; }
  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(304px, 1fr)); gap: 10px; }
  .cell figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stack { position: relative; width: 304px; height: 138px; background: #e8e8e4; border-radius: 4px; overflow: hidden; }
  .stack img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #render-target { position: absolute; left: -10000px; top: 0; width: 304px; height: 138px; }
  @media (max-width: 760px) {
    #tab-basemaps { grid-template-columns: 1fr; height: auto; }
    .viewbar { flex-direction: row; justify-content: center; gap: 10px; }
    .mapwrap { height: 50vh; flex: none; }
  }
</style>
</head>
<body>
<header>
  <h1>PP basemap &amp; thumbnail comparison</h1>
  <button class="tab" data-tab="basemaps" aria-selected="true">Basemaps</button>
  <button class="tab" data-tab="thumbs" aria-selected="false">Thumbnails</button>
  <span class="spacer"></span>
  <label title="PP today: ArcGIS raster tiles cached to zoom 10. Vector: ArcGIS Hosted/WDPCA vector tiles (to zoom 16).">
    Overlays <select id="overlay-mode"><option value="raster">Raster (PP today)</option><option value="vector">Vector (WDPCA)</option></select>
  </label>
  <label title="Unticked: zoom to 18 (vector overlays stay sharp). Ticked: PP's current limit."><input type="checkbox" id="pp-maxzoom"> PP max zoom 10</label>
  <label title="A .pmtiles URL, or the TileJSON URL printed by `pmtiles serve` (e.g. http://pve01:8080/basemap-z10.json)">
    PMTiles URL <input id="pmtiles-url" placeholder="http://pve01:8080/basemap-z10.json" size="22">
  </label>
  <label title="Only needed for the 'Current Mapbox' option. Use a token without URL restrictions; billed as Static Tiles API.">
    Mapbox token <input id="token" type="password" placeholder="optional" size="14">
  </label>
</header>

<section id="tab-basemaps">
  <div class="pane"><div class="bar"><select id="sel-a"></select></div><div class="note" id="note-a"></div><div class="mapwrap"><div class="map" id="map-a"></div><details class="legend" id="legend-a"><summary>Layers</summary><div class="rows"></div></details></div></div>
  <div class="viewbar" title="Current view of both maps (they move together)">
    <div class="zoom" id="view-zoom">z –</div>
    <div class="coords" id="view-coords"></div>
    <button id="copy-view" title="Copy a link that reopens this exact view">Copy view link</button>
  </div>
  <div class="pane"><div class="bar"><select id="sel-b"></select></div><div class="note" id="note-b"></div><div class="mapwrap"><div class="map" id="map-b"></div><details class="legend" id="legend-b"><summary>Layers</summary><div class="rows"></div></details></div></div>
</section>

<section id="tab-thumbs" hidden>
  <label>PA site IDs <input id="site-ids" value="873, 2575, 916" size="30"></label>
  <button id="run-thumbs">Render</button>
  <span class="note">Each row: current PP thumbnail (Mapbox, via protectedplanet.net cache) vs ArcGIS export candidates vs MapLibre client render. Times = load time in this browser.</span>
  <div id="thumbs"></div>
  <div id="render-target"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js"></script>
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<!-- Optional local defaults (git-ignored); see config.local.example.js -->
<script src="config.local.js" onerror="window.PLAYGROUND_CONFIG = window.PLAYGROUND_CONFIG || {}"></script>
<script>
const DG = 'https://data-gis.unep-wcmc.org/server/rest/services'
const UN = 'https://geoservices.un.org/arcgis/rest/services'
const WDPA_MS = `${DG}/ProtectedSites/The_World_Database_of_Protected_Areas/MapServer`
const OECM_MS = `${DG}/ProtectedSites/The_World_Database_on_other_effective_area_based_conservation_measures/MapServer`
const POSITRON = 'https://tiles.openfreemap.org/styles/positron'
const MAPBOX_STYLE = 'unepwcmc/cko1hsfi50vog17l697cr4d6p'
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services'
const UN_ATTR = 'Produced by <a href="https://geoportal.un.org/arcgis/home/item.html?id=541557fd0d4d42efb24449be614e6887">United Nations Geospatial</a>'
const $ = (id) => document.getElementById(id)

// --- Basemap candidates --------------------------------------------------
const raster = (tiles, attribution, extra = {}) => ({
  version: 8,
  sources: { base: { type: 'raster', tiles: [].concat(tiles), tileSize: 256, attribution, ...extra } },
  layers: [{ id: 'base', type: 'raster', source: 'base' }]
})

// ArcGIS VectorTileServer root.json uses relative URLs; make them absolute.
async function arcgisVts (service) {
  const base = `${DG}/Hosted/${service}/VectorTileServer`
  const [meta, style] = await Promise.all([
    fetch(`${base}?f=json`).then(r => r.json()),
    fetch(`${base}/resources/styles/root.json`).then(r => r.json())
  ])
  style.sources = { esri: { type: 'vector', tiles: [`${base}/tile/{z}/{y}/{x}.pbf`], maxzoom: meta.maxLOD ?? 14, attribution: 'UNEP-WCMC, UN Geospatial' } }
  style.glyphs = `${base}/resources/fonts/{fontstack}/{range}.pbf`
  style.sprite = `${base}/resources/sprites/sprite`
  return style
}

// Adds UN boundaries (beneath the first label) and UN labels (on top) from
// WCMC ArcGIS. The style's glyphs must provide 'Noto Sans Regular'.
async function withUn (style) {
  const un = await arcgisVts('UN_Boundaries_Labels')
  style.sources.un = un.sources.esri
  const keep = un.layers.filter(l => l.type !== 'circle' && l['source-layer'] !== 'Major_Lakes')
  const lines = keep.filter(l => l.type === 'line').map(l => ({ ...l, id: `un-boundary-${l.id}`, source: 'un' }))
  const labels = keep.filter(l => l.type === 'symbol').map(l => ({
    ...l, id: `un-label-${l.id}`, source: 'un', layout: { ...l.layout, 'text-font': ['Noto Sans Regular'] }
  }))
  style.layers.splice(style.layers.findIndex(l => l.type === 'symbol'), 0, ...lines)
  style.layers.push(...labels)
  return style
}

// Hillshade from the free AWS Terrain Tiles (terrarium), beneath water.
function withRelief (style) {
  style.sources.dem = {
    type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 15,
    tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
    attribution: 'Terrain: <a href="https://registry.opendata.aws/terrain-tiles/">AWS Terrain Tiles</a>'
  }
  const water = style.layers.findIndex(l => l.id === 'water')
  style.layers.splice(water, 0, {
    id: 'hillshade', type: 'hillshade', source: 'dem',
    paint: { 'hillshade-shadow-color': 'hsl(65, 35%, 21%)', 'hillshade-highlight-color': '#ffffff', 'hillshade-exaggeration': 0.25 }
  })
  return style
}

// OSM physical basemap + UN boundaries/labels from WCMC ArcGIS; prototype of
// the self-hosted target (positron would become our own PMTiles style).
async function hybrid () {
  const pos = await fetch(POSITRON).then(r => r.json())
  pos.layers = pos.layers.filter(l => !/^(boundary_|label_country|label_state|label_other)/.test(l.id))
  for (const l of pos.layers) {   // "Faint" palette from the Mapbox UNEP style
    if (l.id === 'background') l.paint = { 'background-color': 'hsl(35, 25%, 93%)' }
    if (l.id === 'water') l.paint = { ...l.paint, 'fill-color': '#b7d3db' }
  }
  return withUn(pos)
}

// Self-hosted Protomaps styles generated by lib/maps/build-basemap-styles.mjs
// into public/maps/preview/ (serve public/maps, open /compare/).
async function previewPmtiles (name) {
  const url = $('pmtiles-url').value.trim()
  if (!url) throw new Error('Enter the PMTiles URL (top right): a .pmtiles file URL, or the TileJSON URL from `pmtiles serve`.')
  const res = await fetch(`../preview/${name}.json`)
  if (!res.ok) throw new Error('Preview styles not found: serve the public/maps folder and open /compare/.')
  const style = await res.json()
  // Tile URL template: from the .pmtiles file, or from the TileJSON of `pmtiles serve`
  let tiles
  const tileTemplate = async () => {
    if (url.endsWith('.pmtiles')) return `pmtiles://${url}/{z}/{x}/{y}`
    if (!tiles) {
      const tj = await fetch(url).then(r => r.json()).catch(() => null)
      if (!tj || !tj.tiles) throw new Error(`Cannot read the PMTiles TileJSON at ${url}: is \`pmtiles serve\` running?`)
      tiles = tj.tiles[0]
    }
    return tiles
  }
  for (const src of Object.values(style.sources)) {
    if (src.url === '__PMTILES_URL__') src.url = url.endsWith('.pmtiles') ? `pmtiles://${url}` : url
    if (src.tiles && src.tiles[0] === '__PMTILES_TILES__') src.tiles = [await tileTemplate()]
  }
  return style
}

const CANDIDATES = {
  mapbox: {
    name: 'Current: Mapbox UNEP Basemap Faint (needs token)',
    note: '<b class="warn">Reference only.</b> Static Tiles API raster of the current style; billed per tile.',
    build: () => {
      const t = $('token').value.trim()
      if (!t) throw new Error('Enter a Mapbox token (top right) to show the current style.')
      return raster(`https://api.mapbox.com/styles/v1/${MAPBOX_STYLE}/tiles/256/{z}/{x}/{y}@2x?access_token=${t}`, '&copy; Mapbox &copy; OpenStreetMap')
    }
  },
  hybrid: {
    name: 'Hybrid: OSM (OpenFreeMap) + UN boundaries/labels (WCMC ArcGIS)',
    note: '<b class="ok">UN boundaries & labels.</b> Prototype of the target: positron → own PMTiles later. Faint colours applied. Fonts: Noto Sans.',
    build: hybrid
  },
  'hybrid-relief': {
    name: 'Hybrid + terrain relief',
    note: '<b class="ok">UN boundaries & labels.</b> Adds hillshade (AWS Terrain Tiles, free) like the current style.',
    build: async () => withRelief(await hybrid())
  },
  'unep-outdoor': {
    name: 'Self-hosted PMTiles: UNEP Outdoor (original design)',
    note: '<b class="ok">UN boundaries & labels. Free to use:</b> own palette on Protomaps layers (BSD-3), relief, pale vegetation so PP overlays stay dominant.',
    build: () => previewPmtiles('unep-outdoor')
  },
  'versatiles-muted': {
    name: 'VersaTiles muted (free hosted tiles, MIT) + UN boundaries/labels',
    note: '<b class="ok">UN boundaries & labels.</b> Not our PMTiles: uses the free VersaTiles tile server (OSM, Shortbread schema).',
    build: async () => {
      const res = await fetch('../preview/versatiles-muted.json')
      if (!res.ok) throw new Error('Preview styles not found: serve the public/maps folder and open /compare/.')
      return res.json()
    }
  },
  'pmtiles-mapbox-v2': {
    name: 'Self-hosted PMTiles: Mapbox UNEP Faint replica v2 (tuned)',
    note: '<b class="ok">UN boundaries & labels.</b> v1 tuned on Mapbox screenshots: capitals only (to zoom 8), no roads before zoom 5, no borders at world view, green forests. <b class="warn">Testing only: licence to check (issue #2).</b>',
    build: () => previewPmtiles('pmtiles-mapbox-v2')
  },
  'pmtiles-mapbox': {
    name: 'Self-hosted PMTiles: Mapbox UNEP Faint replica v1',
    note: '<b class="ok">UN boundaries & labels.</b> Mapbox style values translated to Protomaps tiles; Noto Sans; hillshade from AWS Terrain Tiles. <b class="warn">Testing only: licence to check (issue #2).</b>',
    build: () => previewPmtiles('pmtiles-mapbox')
  },
  pmtiles: {
    name: 'Self-hosted PMTiles (Protomaps light) + UN boundaries/labels',
    note: '<b class="ok">UN boundaries & labels.</b> Protomaps default design with faint land/water colours.',
    build: () => previewPmtiles('pmtiles')
  },
  'pmtiles-relief': {
    name: 'Self-hosted PMTiles (Protomaps light) + terrain relief',
    note: '<b class="ok">UN boundaries & labels.</b> As above, plus hillshade. In production the DEM would be self-hosted too.',
    build: () => previewPmtiles('pmtiles-relief')
  },
  'wcmc-template': {
    name: 'WCMC ArcGIS: Hosted/Basemap_Template (vector)',
    note: '<b class="ok">UN boundaries & labels.</b> Already on data-gis, z0–12. Minimal: land, lakes, coast, graticule.',
    build: () => arcgisVts('Basemap_Template')
  },
  'wcmc-unbnd': {
    name: 'WCMC ArcGIS: Hosted/UN_Boundaries (vector)',
    note: '<b class="ok">UN boundaries.</b> Already on data-gis, z0–14. Country polygons + admin lines.',
    build: () => arcgisVts('UN_Boundaries')
  },
  'un-topo': {
    name: 'UN ClearMap WebTopo (raster)',
    note: '<b class="ok">UN-official.</b> geoservices.un.org; UN Secretariat/community use, clearance may be required.',
    build: () => raster(`${UN}/ClearMap_WebTopo/MapServer/tile/{z}/{y}/{x}`, UN_ATTR)
  },
  'un-gray': {
    name: 'UN ClearMap WebGray (raster)',
    note: '<b class="ok">UN-official.</b> Same terms as WebTopo. Some scales not rendered.',
    build: () => raster(`${UN}/ClearMap_WebGray/MapServer/tile/{z}/{y}/{x}`, UN_ATTR)
  },
  'un-plain': {
    name: 'UN ClearMap WebPlain (raster)',
    note: '<b class="ok">UN-official.</b> Same terms as WebTopo. Slow to respond in tests.',
    build: () => raster(`${UN}/ClearMap_WebPlain/MapServer/tile/{z}/{y}/{x}`, UN_ATTR)
  },
  positron: {
    name: 'OpenFreeMap positron (OSM only)',
    note: '<b class="warn">OSM boundaries & names — not UN-compliant</b> (e.g. disputed areas). Free, no key.',
    build: () => POSITRON
  },
  'sat-esri': {
    name: 'Satellite: Esri World Imagery + boundaries/places',
    note: '<b class="warn">Esri reference labels are not UN boundaries.</b> Check ArcGIS licence for public use.',
    build: () => ({
      version: 8,
      sources: {
        img: { type: 'raster', tiles: [`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`], tileSize: 256, maxzoom: 19, attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community' },
        ref: { type: 'raster', tiles: [`${ESRI}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`], tileSize: 256, maxzoom: 19 }
      },
      layers: [{ id: 'img', type: 'raster', source: 'img' }, { id: 'ref-boundary', type: 'raster', source: 'ref' }]
    })
  },
  'sat-esri-un': {
    name: 'Satellite: Esri World Imagery + UN boundaries/labels',
    note: '<b class="ok">UN boundaries & labels</b> over Esri imagery.',
    build: async () => {
      const un = await arcgisVts('UN_Boundaries_Labels')
      un.layers = [{ id: 'img', type: 'raster', source: 'img' }, ...un.layers.filter(l => l.type !== 'circle' && l['source-layer'] !== 'Major_Lakes')]
      un.sources.img = { type: 'raster', tiles: [`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`], tileSize: 256, maxzoom: 19, attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community' }
      for (const l of un.layers) if (l.type === 'symbol') l.paint = { ...l.paint, 'text-color': '#fff', 'text-halo-color': '#000' }
      return un
    }
  },
  'sat-eox': {
    name: 'Satellite: EOX Sentinel-2 Cloudless 2025 + UN boundaries/labels',
    note: '<b class="warn">Licence: CC BY-NC-SA for 2018+ years</b> (non-commercial). 10 m resolution.',
    build: async () => {
      const style = await CANDIDATES['sat-esri-un'].build()
      style.sources.img = { type: 'raster', tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2025_3857/default/GoogleMapsCompatible/{z}/{y}/{x}.jpg'], tileSize: 256, maxzoom: 15, attribution: 'Sentinel-2 cloudless 2025 by <a href="https://s2maps.eu">EOX IT Services GmbH</a> (Contains modified Copernicus Sentinel data 2025)' }
      return style
    }
  }
}

// Dropdown order and labels: (n) = family, letter = variant of that family
const NUMBERING = [
  ['mapbox', '1'],
  ['unep-outdoor', '2a'], ['pmtiles-mapbox-v2', '2b'], ['pmtiles-mapbox', '2c'], ['pmtiles', '2d'], ['pmtiles-relief', '2e'],
  ['hybrid', '3a'], ['hybrid-relief', '3b'],
  ['versatiles-muted', '4'],
  ['un-topo', '5a'], ['un-gray', '5b'], ['un-plain', '5c'],
  ['wcmc-template', '6a'], ['wcmc-unbnd', '6b'],
  ['positron', '7'],
  ['sat-esri-un', '8a'], ['sat-esri', '8b'], ['sat-eox', '8c']
]
for (const [key, number] of NUMBERING) CANDIDATES[key].name = `(${number}) ${CANDIDATES[key].name}`

// --- Overlays, as PP adds them (ArcGIS raster tiles beneath labels) -------
const OVERLAYS = [
  { id: 'ov-wdpa', url: `${WDPA_MS}/tile/{z}/{y}/{x}` },
  { id: 'ov-oecm', url: `${OECM_MS}/tile/{z}/{y}/{x}` }
]
// Same filters/colours as PP's ?overlays=vector preview (preview-options.js)
const REALM_COLOR = ['match', ['get', 'realm'], 'Terrestrial', '#38A800', ['Coastal', 'Marine'], '#004DA8', '#999999']
const VECTOR_OVERLAYS = [
  { id: 'ov-wdpa', filter: ['==', ['get', 'site_type'], 'PA'], color: REALM_COLOR },
  { id: 'ov-oecm', filter: ['==', ['get', 'site_type'], 'OECM'], color: '#D9B143' }
]

function firstForegroundLayerId (map) {
  let symbol
  for (const l of map.getStyle().layers) {
    if (l.id.match('boundary')) return l.id
    if (l.type === 'symbol' && !symbol) symbol = l.id
  }
  return symbol
}

function addOverlays (map) {
  const before = firstForegroundLayerId(map)
  if ($('overlay-mode').value === 'vector') {
    if (!map.getSource('wdpca')) {
      map.addSource('wdpca', { type: 'vector', tiles: [`${DG}/Hosted/WDPCA/VectorTileServer/tile/{z}/{y}/{x}.pbf`], maxzoom: 16 })
    }
    for (const o of VECTOR_OVERLAYS) {
      const common = { source: 'wdpca', filter: o.filter }
      map.addLayer({ ...common, id: o.id, type: 'fill', 'source-layer': 'WDPCA_poly_latest', paint: { 'fill-color': o.color, 'fill-opacity': 0.5 } }, before)
      map.addLayer({ ...common, id: `${o.id}-line`, type: 'line', 'source-layer': 'WDPCA_poly_latest', paint: { 'line-color': o.color, 'line-width': 0.6 } }, before)
      map.addLayer({ ...common, id: `${o.id}-point`, type: 'circle', 'source-layer': 'WDPCA_point_latest', paint: { 'circle-color': o.color, 'circle-opacity': 0.7, 'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, 1.5, 6, 2.5, 12, 4.5] } }, before)
    }
    return
  }
  for (const o of OVERLAYS) {
    // ArcGIS caches these tiles to zoom 10 only: stretch them beyond instead of leaving gaps
    map.addLayer({ id: o.id, type: 'raster', source: { type: 'raster', tiles: [o.url], tileSize: 128, maxzoom: 10 } }, before)
  }
}

// --- Interactive legend: show/hide and opacity per layer group ------------
const SOURCE_LAYER_NAMES = {
  earth: 'Land', land: 'Land', landcover: 'Land cover', landuse: 'Land use', park: 'Parks', landuse_overlay: 'Parks & wetlands',
  water: 'Water', waterway: 'Rivers', water_name: 'Water labels', roads: 'Roads', transportation: 'Roads',
  transportation_name: 'Road labels', places: 'Cities & places', place: 'Cities & places', pois: 'Points of interest',
  poi: 'Points of interest', boundaries: 'Boundaries (OSM)', boundary: 'Boundaries (OSM)', buildings: 'Buildings',
  building: 'Buildings', aeroway: 'Airports', aerodrome_label: 'Airports', mountain_peak: 'Peaks', housenumber: 'House numbers'
}
const OPACITY_PROPS = {
  fill: ['fill-opacity'], line: ['line-opacity'], symbol: ['text-opacity', 'icon-opacity'], raster: ['raster-opacity'],
  circle: ['circle-opacity', 'circle-stroke-opacity'], background: ['background-opacity'], hillshade: ['hillshade-exaggeration']
}
const DEFAULT_OPACITY = { 'hillshade-exaggeration': 0.5 }

function groupName (layer) {
  if (layer.id.startsWith('ov-wdpa')) return 'Overlay: Protected areas (WDPA)'
  if (layer.id.startsWith('ov-oecm')) return 'Overlay: OECMs'
  if (layer.type === 'background') return 'Background'
  if (layer.type === 'hillshade') return 'Relief (hillshade)'
  if (layer.id.startsWith('national-park')) return 'National parks (OSM)'
  if (layer.source === 'un' || /^UNGIWG|^Countries|^Administrative|^Major Lakes|^Unsettled|^graticule|^sea_shade/.test(layer.id)) {
    return layer.type === 'symbol' ? 'UN labels' : layer.type === 'line' ? 'UN boundaries & lines' : 'UN areas'
  }
  if (layer.type === 'raster') return /ref/.test(layer.id) ? 'Reference labels (raster)' : 'Basemap image'
  const name = SOURCE_LAYER_NAMES[layer['source-layer']] || layer['source-layer'] || layer.id
  return layer.type === 'symbol' && !/label|places|Points|Peaks|numbers|Airports/i.test(name) ? `${name} labels` : name
}

const isZoom = (e) => Array.isArray(e) && e[0] === 'zoom'
// Scales an opacity value, keeping zoom curves valid (zoom must stay top level)
function scaleOpacity (value, f) {
  if (value === undefined || value === null) return f
  if (typeof value === 'number') return value * f
  if (value.stops) return { ...value, stops: value.stops.map(([z, v]) => [z, scaleOpacity(v, f)]) }
  if (Array.isArray(value) && String(value[0]).startsWith('interpolate') && isZoom(value[2])) {
    return value.map((v, i) => (i >= 4 && i % 2 === 0 ? scaleOpacity(v, f) : v))
  }
  if (Array.isArray(value) && value[0] === 'step' && isZoom(value[1])) {
    return value.map((v, i) => (i === 2 || (i >= 4 && i % 2 === 0) ? scaleOpacity(v, f) : v))
  }
  return ['*', value, f]
}

// group -> { visible, opacity }, kept per map across basemap switches
const legendState = { a: {}, b: {} }

function buildLegend (side) {
  const map = maps[side]
  const rows = $(`legend-${side}`).querySelector('.rows')
  const groups = new Map()
  for (const layer of map.getStyle().layers) {
    const name = groupName(layer)
    if (!groups.has(name)) groups.set(name, [])
    groups.get(name).push({
      id: layer.id,
      originals: Object.fromEntries((OPACITY_PROPS[layer.type] || []).map(p => [p, map.getPaintProperty(layer.id, p) ?? DEFAULT_OPACITY[p]]))
    })
  }
  const apply = (name) => {
    const st = legendState[side][name]
    for (const l of groups.get(name)) {
      if (!map.getLayer(l.id)) continue
      map.setLayoutProperty(l.id, 'visibility', st.visible ? 'visible' : 'none')
      for (const [p, v] of Object.entries(l.originals)) map.setPaintProperty(l.id, p, scaleOpacity(v, st.opacity / 100))
    }
  }
  // "Protected areas & OECMs" section first, then basemap groups top to bottom
  const isOverlay = (name) => name.startsWith('Overlay: ')
  const names = [...groups.keys()].reverse()
  names.sort((x, y) => isOverlay(y) - isOverlay(x) || (isOverlay(x) && y.includes('Protected areas') - x.includes('Protected areas')))
  rows.innerHTML = ''
  let section = null
  for (const name of names) {
    const heading = isOverlay(name) ? 'Protected areas & OECMs' : 'Basemap'
    if (heading !== section) {
      section = heading
      const head = document.createElement('div')
      head.className = 'head'
      head.textContent = heading
      rows.appendChild(head)
    }
    // Overlays start hidden, to look at the basemaps first
    const st = legendState[side][name] || (legendState[side][name] = { visible: !isOverlay(name), opacity: 100 })
    const label = name.replace('Overlay: ', '')
    const row = document.createElement('div')
    row.className = 'row'
    row.innerHTML = `<label title="${label}"><input type="checkbox" ${st.visible ? 'checked' : ''}> ${label}</label>` +
      `<input type="range" min="0" max="100" step="5" value="${st.opacity}" title="Opacity ${st.opacity}%">`
    const [check, range] = row.querySelectorAll('input')
    check.addEventListener('change', () => { st.visible = check.checked; apply(name) })
    range.addEventListener('input', () => { st.opacity = Number(range.value); range.title = `Opacity ${range.value}%`; apply(name) })
    rows.appendChild(row)
    if (!st.visible || st.opacity !== 100) apply(name)
  }
}

// --- Side-by-side maps ----------------------------------------------------
// 18 shows PAs/OECMs at their best resolution; 10 is PP's current limit
const maxZoom = () => ($('pp-maxzoom').checked ? 10 : 18)

// View in the URL hash (#zoom/lat/lon), so a copied link reopens the same view
function viewFromHash () {
  const [z, lat, lon] = location.hash.slice(1).split('/').map(Number)
  return [z, lat, lon].every(Number.isFinite) ? { zoom: z, center: [lon, lat] } : { zoom: 1.3, center: [20, 5] }
}
const INITIAL_VIEW = viewFromHash()

function showView (map) {
  const z = map.getZoom()
  const c = map.getCenter()
  $('view-zoom').textContent = `z ${z.toFixed(2)}`
  $('view-coords').textContent = `${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`
  history.replaceState(null, '', `#${z.toFixed(2)}/${c.lat.toFixed(4)}/${c.lng.toFixed(4)}`)
}

$('copy-view').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(location.href)
    $('copy-view').textContent = 'Copied'
  } catch (e) {
    prompt('Copy this link:', location.href)
  }
  setTimeout(() => { $('copy-view').textContent = 'Copy view link' }, 1500)
})
const maps = {}
let syncing = false

function makeMap (side, key) {
  const sel = $(`sel-${side}`)
  for (const [k] of NUMBERING) sel.add(new Option(CANDIDATES[k].name, k, false, k === key))
  const map = new maplibregl.Map({ container: `map-${side}`, style: { version: 8, sources: {}, layers: [] }, ...INITIAL_VIEW, maxZoom: maxZoom() })
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }))
  map.on('style.load', () => {
    // Compare every option in the same flat Web Mercator projection
    map.setProjection({ type: 'mercator' })
    addOverlays(map)
    buildLegend(side)
  })
  map.on('move', () => showView(map))
  map.on('move', () => {
    if (syncing) return
    syncing = true
    const other = maps[side === 'a' ? 'b' : 'a']
    other && other.jumpTo({ center: map.getCenter(), zoom: map.getZoom() })
    syncing = false
  })
  sel.addEventListener('change', () => setBasemap(side))
  maps[side] = map
  setBasemap(side)
}

async function setBasemap (side) {
  const key = $(`sel-${side}`).value
  const note = $(`note-${side}`)
  note.innerHTML = CANDIDATES[key].note
  try {
    maps[side].setStyle(await CANDIDATES[key].build(), { diff: false })
  } catch (e) {
    note.innerHTML = `<b class="warn">${e.message}</b>`
  }
}

$('overlay-mode').addEventListener('change', () => ['a', 'b'].forEach(setBasemap))
$('pp-maxzoom').addEventListener('change', () => Object.values(maps).forEach(m => m.setMaxZoom(maxZoom())))
// Defaults: config.local.js (shared by every browser using this server),
// overridden by what was last typed in this browser
const CONFIG = window.PLAYGROUND_CONFIG || {}
const stored = (key) => { try { return localStorage.getItem(key) } catch (e) { return null } }
const store = (key, value) => { try { localStorage.setItem(key, value) } catch (e) {} }
$('token').value = stored('mapbox-token') || CONFIG.mapboxToken || ''
$('pmtiles-url').value = stored('pmtiles-url') || CONFIG.pmtilesUrl || ''

$('token').addEventListener('change', (e) => {
  store('mapbox-token', e.target.value.trim())
  ;['a', 'b'].forEach(s => $(`sel-${s}`).value === 'mapbox' && setBasemap(s))
})

maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile)
$('pmtiles-url').addEventListener('change', (e) => {
  store('pmtiles-url', e.target.value.trim())
  ;['a', 'b'].forEach(s => $(`sel-${s}`).value.startsWith('pmtiles') && setBasemap(s))
})

// Left: current Mapbox map (reference); right: the original UNEP Outdoor
makeMap('a', 'mapbox')
makeMap('b', 'unep-outdoor')
showView(maps.a)

// --- Thumbnails -----------------------------------------------------------
const R = 6378137
const toMerc = (x, y) => [x * Math.PI / 180 * R, Math.log(Math.tan(Math.PI / 4 + y * Math.PI / 360)) * R]

async function extentFor (id) {
  for (const layer of [1, 0]) {   // polygons, then points
    const r = await fetch(`${WDPA_MS}/${layer}/query?where=site_id%3D${id}&returnExtentOnly=true&outSR=4326&f=json`).then(r => r.json())
    const e = r.extent
    if (e && Number.isFinite(e.xmin)) {
      const d = layer === 0 ? 0.2 : 0
      return { xmin: e.xmin - d, ymin: e.ymin - d, xmax: e.xmax + d, ymax: e.ymax + d }
    }
  }
  throw new Error(`site_id ${id} not found`)
}

// Same framing as Mapbox "auto": padded bbox stretched to the 304x138 ratio.
function fitBbox (e, w = 304, h = 138, pad = 0.1) {
  const [x0, y0] = toMerc(e.xmin, e.ymin), [x1, y1] = toMerc(e.xmax, e.ymax)
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2
  let dx = Math.max((x1 - x0) * (1 + 2 * pad), 2000), dy = Math.max((y1 - y0) * (1 + 2 * pad), 2000)
  if (dx / dy > w / h) dy = dx * h / w; else dx = dy * w / h
  return [cx - dx / 2, cy - dy / 2, cx + dx / 2, cy + dy / 2]
}

const exportUrl = (svc, bbox, extra = '') =>
  `${svc}/export?bbox=${bbox.map(v => v.toFixed(1)).join(',')}&bboxSR=3857&imageSR=3857&size=608,276&format=png32&transparent=true&f=image${extra}`

const overlayUrl = (id, bbox) => exportUrl(WDPA_MS, bbox,
  `&layers=show:0,1&layerDefs=${encodeURIComponent(JSON.stringify({ 0: `site_id=${id}`, 1: `site_id=${id}` }))}`)

function timedStack (urls) {
  const fig = document.createElement('figure'); fig.className = 'cell'; fig.style.margin = 0
  const stack = document.createElement('div'); stack.className = 'stack'
  const cap = document.createElement('figcaption')
  const t0 = performance.now(); let left = urls.length
  for (const u of urls) {
    const img = new Image(); img.alt = ''
    img.onload = img.onerror = (ev) => {
      if (ev.type === 'error') cap.dataset.err = '1'
      if (--left === 0) cap.textContent += ` — ${Math.round(performance.now() - t0)} ms${cap.dataset.err ? ' (error)' : ''}`
    }
    img.src = u; stack.appendChild(img)
  }
  fig.append(stack, cap)
  return { fig, cap }
}

// One shared offscreen map renders all MapLibre thumbnails in sequence.
let renderMap
async function maplibreThumb (id, e) {
  if (!renderMap) {
    renderMap = new maplibregl.Map({
      container: 'render-target', style: await hybrid(), interactive: false, attributionControl: false,
      pixelRatio: 2, canvasContextAttributes: { preserveDrawingBuffer: true }, fadeDuration: 0
    })
    await renderMap.once('load')
    renderMap.addSource('wdpca', { type: 'vector', tiles: [`${DG}/Hosted/WDPCA/VectorTileServer/tile/{z}/{y}/{x}.pbf`], maxzoom: 15 })
    renderMap.addLayer({ id: 'pa-fill', type: 'fill', source: 'wdpca', 'source-layer': 'WDPCA_poly_latest', paint: { 'fill-color': '#38A800', 'fill-opacity': 0.6, 'fill-outline-color': '#2a7d00' } })
    renderMap.addLayer({ id: 'pa-point', type: 'circle', source: 'wdpca', 'source-layer': 'WDPCA_point_latest', paint: { 'circle-color': '#38A800', 'circle-radius': 5 } })
  }
  const t0 = performance.now()
  for (const l of ['pa-fill', 'pa-point']) renderMap.setFilter(l, ['==', ['to-number', ['get', 'site_id']], Number(id)])
  renderMap.fitBounds([[e.xmin, e.ymin], [e.xmax, e.ymax]], { padding: 14, animate: false, maxZoom: 12 })
  await renderMap.once('idle')
  return { src: renderMap.getCanvas().toDataURL('image/png'), ms: Math.round(performance.now() - t0) }
}

let thumbQueue = Promise.resolve()
$('run-thumbs').addEventListener('click', () => {
  const ids = $('site-ids').value.split(/[\s,]+/).filter(Boolean)
  $('thumbs').innerHTML = ''
  for (const id of ids) {
    const row = document.createElement('div'); row.className = 'row'
    row.innerHTML = `<h3>site_id ${id}</h3><div class="cells"></div>`
    $('thumbs').appendChild(row)
    const cells = row.querySelector('.cells')
    extentFor(id).then(e => {
      const bbox = fitBbox(e)
      const add = (urls, label) => { const { fig, cap } = timedStack(urls); cap.textContent = label; cells.appendChild(fig) }
      add([`https://www.protectedplanet.net/assets/tiles/${id}?type=protected_area&version=1`], 'Current PP (Mapbox Static Images)')
      add([exportUrl(`${UN}/ClearMap_WebTopo/MapServer`, bbox), overlayUrl(id, bbox)], 'ArcGIS export: UN ClearMap Topo + WDPA')
      add([exportUrl(`${UN}/ClearMap_WebGray/MapServer`, bbox), overlayUrl(id, bbox)], 'ArcGIS export: UN ClearMap Gray + WDPA')
      add([exportUrl(`${ESRI}/World_Imagery/MapServer`, bbox), overlayUrl(id, bbox)], 'ArcGIS export: Esri Imagery + WDPA')
      const fig = document.createElement('figure'); fig.className = 'cell'; fig.style.margin = 0
      fig.innerHTML = '<div class="stack"></div><figcaption>MapLibre render: hybrid + WDPCA vector tiles — queued…</figcaption>'
      cells.appendChild(fig)
      thumbQueue = thumbQueue.then(() => maplibreThumb(id, e)).then(({ src, ms }) => {
        fig.querySelector('.stack').innerHTML = `<img alt="" src="${src}">`
        fig.querySelector('figcaption').textContent = `MapLibre render: hybrid + WDPCA vector tiles — ${ms} ms`
      }).catch(err => { fig.querySelector('figcaption').textContent = `MapLibre render failed: ${err.message}` })
    }).catch(err => { cells.textContent = err.message })
  }
})

for (const btn of document.querySelectorAll('button.tab')) {
  btn.addEventListener('click', () => {
    for (const b of document.querySelectorAll('button.tab')) b.setAttribute('aria-selected', b === btn)
    $('tab-basemaps').hidden = btn.dataset.tab !== 'basemaps'
    $('tab-thumbs').hidden = btn.dataset.tab !== 'thumbs'
    Object.values(maps).forEach(m => m.resize())
  })
}
